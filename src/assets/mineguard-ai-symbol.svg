<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Shield -->
  <path d="M50 8 C68 8 86 16 86 32 C86 62 50 88 50 92 C50 88 14 62 14 32 C14 16 32 8 50 8 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#subtleShadow)" />

  <!-- Inner Shield Border Highlight -->
  <path d="M50 13 C65 13 81 20 81 33 C81 59 50 82 50 86 C50 82 19 59 19 33 C19 20 35 13 50 13 Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.25)" 
        stroke-width="1.5" />

  <!-- Mining Cart Body & Geometry -->
  <!-- Cart upper rim -->
  <path d="M30 42 L70 42 L65 58 L35 58 Z" 
        fill="#FFFFFF" 
        opacity="0.95" />

  <!-- Coal Ore Mound inside cart -->
  <path d="M34 42 C34 35 42 32 50 32 C58 32 66 35 66 42 Z" 
        fill="url(#accentGrad)" />

  <!-- Cart structural divider -->
  <line x1="50" y1="42" x2="50" y2="58" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round" />

  <!-- Wheels / Track Rail -->
  <circle cx="39" cy="65" r="4.5" fill="#FFFFFF" />
  <circle cx="39" cy="65" r="2" fill="#1E3A8A" />
  <circle cx="61" cy="65" r="4.5" fill="#FFFFFF" />
  <circle cx="61" cy="65" r="2" fill="#1E3A8A" />

  <!-- Track Rail under wheels -->
  <path d="M26 73 L74 73" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" />
  <path d="M33 73 L31 77 M44 73 L43 77 M56 73 L57 77 M67 73 L69 77" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round" />

  <!-- Safety Sparkle / Star of vigilance at top -->
  <polygon points="50,18 52,24 58,26 52,28 50,34 48,28 42,26 48,24" fill="#FBBF24" />
</svg>
