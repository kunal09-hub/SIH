<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#EBF3FE" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02" />
    </linearGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#64748B" stroke-width="0.75" stroke-opacity="0.1" />
      <circle cx="40" cy="40" r="1" fill="#3B82F6" fill-opacity="0.2" />
    </pattern>

    <!-- Dense Sub-Grid Pattern -->
    <pattern id="dotGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="1.5" fill="#2563EB" fill-opacity="0.15" />
      <path d="M 50 60 L 70 60 M 60 50 L 60 70" stroke="#3B82F6" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>

    <!-- Faint Watermark Shield Gradient -->
    <linearGradient id="watermarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Base Fill -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />

  <!-- Grid Overlays -->
  <rect width="800" height="1000" fill="url(#lightGrid)" />
  <rect width="800" height="1000" fill="url(#dotGrid)" />

  <!-- Soft Abstract Dynamic Top & Bottom Waves -->
  <path d="M-100 250 C150 180, 350 340, 600 220 C750 150, 850 210, 950 180 L950 0 L-100 0 Z" fill="url(#waveGrad1)" />
  <path d="M-100 450 C200 320, 450 520, 700 380 C820 310, 880 340, 950 320 L950 0 L-100 0 Z" fill="url(#waveGrad2)" />
  <path d="M-100 800 C150 650, 450 920, 750 780 C850 730, 900 760, 950 740 L950 1000 L-100 1000 Z" fill="url(#waveGrad1)" />

  <!-- Subtle Safety Elevation Contours / Topo Lines -->
  <path d="M-50 600 Q 200 500, 400 620 T 850 550" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="8 6" />
  <path d="M-50 660 Q 220 560, 420 680 T 850 610" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.06" />
  <path d="M-50 720 Q 240 620, 440 740 T 850 670" fill="none" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.05" stroke-dasharray="4 4" />

  <!-- Large Faint Watermark Emblem in Background -->
  <g transform="translate(420, 480) scale(4.2)" opacity="0.85">
    <!-- Shield Outline -->
    <path d="M50 8 C68 8 86 16 86 32 C86 62 50 88 50 92 C50 88 14 62 14 32 C14 16 32 8 50 8 Z" 
          fill="url(#watermarkGrad)" 
          stroke="#1E3A8A" 
          stroke-opacity="0.06" 
          stroke-width="1.5" />
    
    <!-- Watermark Cart Body -->
    <path d="M30 42 L70 42 L65 58 L35 58 Z" 
          fill="#1E3A8A" 
          fill-opacity="0.04" />
          
    <circle cx="39" cy="65" r="4.5" fill="#1E3A8A" fill-opacity="0.05" />
    <circle cx="61" cy="65" r="4.5" fill="#1E3A8A" fill-opacity="0.05" />
    <path d="M26 73 L74 73" stroke="#1E3A8A" stroke-width="2" stroke-opacity="0.06" />
  </g>

  <!-- Ambient Glow Elements -->
  <circle cx="150" cy="180" r="180" fill="#38BDF8" fill-opacity="0.06" filter="blur(60px)" />
  <circle cx="700" cy="850" r="220" fill="#2563EB" fill-opacity="0.05" filter="blur(70px)" />
</svg>
